<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude 对话查看器</title>
<style>
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface2: #f0ede6;
    --border: #e0dbd0;
    --text: #1a1814;
    --text2: #6b6560;
    --text3: #9c9690;
    --accent: #c17b3a;
    --accent-light: #f5e9d8;
    --human-bg: #eef4ff;
    --human-border: #b8d0f5;
    --human-text: #1a3a6b;
    --claude-bg: #f0faf5;
    --claude-border: #a8dfc0;
    --claude-text: #0f4a2a;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Layout */
  #app { display: flex; height: 100vh; overflow: hidden; }
  #sidebar { width: 300px; min-width: 300px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* Sidebar header */
  #sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid var(--border); }
  #sidebar-header h1 { font-size: 17px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
  #sidebar-header p { font-size: 12px; color: var(--text3); margin-top: 3px; font-family: sans-serif; }
  #stats-bar { display: flex; gap: 12px; margin-top: 10px; }
  .stat { font-size: 11px; font-family: sans-serif; color: var(--text2); background: var(--surface2); padding: 3px 8px; border-radius: 20px; }
  .stat span { font-weight: 600; color: var(--accent); }

  /* Search */
  #search-wrap { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  #search { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: sans-serif; background: var(--surface2); color: var(--text); outline: none; transition: border-color 0.2s; }
  #search:focus { border-color: var(--accent); }

  /* Conversation list */
  #conv-list { flex: 1; overflow-y: auto; padding: 6px; }
  #conv-list::-webkit-scrollbar { width: 4px; }
  #conv-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .conv-item { padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 2px; transition: background 0.15s; border: 1px solid transparent; }
  .conv-item:hover { background: var(--surface2); }
  .conv-item.active { background: var(--accent-light); border-color: var(--accent); }
  .conv-item-title { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: sans-serif; }
  .conv-item-meta { font-size: 11px; color: var(--text3); margin-top: 3px; font-family: sans-serif; }

  /* Drop zone */
  #drop-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px; text-align: center; }
  #drop-zone.drag-over { background: var(--accent-light); }
  .drop-icon { width: 64px; height: 64px; background: var(--accent-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  #drop-zone h2 { font-size: 18px; color: var(--text); font-weight: 500; }
  #drop-zone p { font-size: 13px; color: var(--text2); font-family: sans-serif; line-height: 1.6; max-width: 320px; }
  #file-btn { padding: 9px 20px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 13px; font-family: sans-serif; cursor: pointer; transition: opacity 0.2s; }
  #file-btn:hover { opacity: 0.85; }
  #file-input { display: none; }

  /* Chat view */
  #chat-view { display: none; flex-direction: column; height: 100%; }
  #chat-header { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
  #chat-title { font-size: 16px; font-weight: 600; color: var(--text); }
  #chat-meta { font-size: 12px; color: var(--text3); margin-top: 2px; font-family: sans-serif; }
  #chat-body { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  #chat-body::-webkit-scrollbar { width: 4px; }
  #chat-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Messages */
  .msg-wrap { display: flex; flex-direction: column; gap: 4px; }
  .msg-role { font-size: 11px; font-weight: 600; font-family: sans-serif; letter-spacing: 0.5px; text-transform: uppercase; padding: 0 4px; }
  .msg-role.human { color: var(--human-text); }
  .msg-role.assistant { color: var(--claude-text); }
  .msg-role.system { color: var(--text3); }
  .msg-bubble { padding: 12px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.7; max-width: 820px; }
  .msg-bubble.human { background: var(--human-bg); border: 1px solid var(--human-border); color: var(--text); }
  .msg-bubble.assistant { background: var(--claude-bg); border: 1px solid var(--claude-border); color: var(--text); }
  .msg-bubble.system { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); font-style: italic; font-size: 13px; }
  .msg-bubble pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: var(--radius-sm); overflow-x: auto; font-size: 12px; margin: 8px 0; font-family: 'Courier New', monospace; }
  .msg-bubble code { background: rgba(0,0,0,0.07); padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: 'Courier New', monospace; }
  .msg-bubble pre code { background: none; padding: 0; }
  .msg-bubble h1,.msg-bubble h2,.msg-bubble h3 { margin: 10px 0 6px; font-weight: 600; }
  .msg-bubble h1 { font-size: 18px; } .msg-bubble h2 { font-size: 16px; } .msg-bubble h3 { font-size: 14px; }
  .msg-bubble p { margin: 6px 0; }
  .msg-bubble ul,.msg-bubble ol { padding-left: 20px; margin: 6px 0; }
  .msg-bubble li { margin: 3px 0; }
  .msg-bubble blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text2); margin: 8px 0; }
  .msg-bubble strong { font-weight: 600; }
  .msg-bubble em { font-style: italic; }
  .msg-bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .msg-bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
  .msg-bubble th { background: var(--surface2); padding: 6px 10px; text-align: left; border: 1px solid var(--border); font-weight: 600; }
  .msg-bubble td { padding: 6px 10px; border: 1px solid var(--border); }

  /* Export button */
  #export-btn { margin: 12px 24px; padding: 8px 16px; background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-family: sans-serif; color: var(--text2); cursor: pointer; align-self: flex-start; transition: all 0.2s; }
  #export-btn:hover { border-color: var(--accent); color: var(--accent); }

  .empty { text-align: center; color: var(--text3); font-size: 13px; padding: 40px; font-family: sans-serif; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Claude 对话记录</h1>
      <p id="file-name">未加载文件</p>
      <div id="stats-bar" style="display:none;">
        <div class="stat"><span id="s-convs">0</span> 条对话</div>
        <div class="stat"><span id="s-msgs">0</span> 条消息</div>
      </div>
    </div>
    <div id="search-wrap" style="display:none;">
      <input type="text" id="search" placeholder="搜索对话标题..." oninput="filterList()">
    </div>
    <div id="conv-list">
      <div class="empty" id="list-empty">请先加载 JSON 文件</div>
    </div>
  </div>

  <div id="main">
    <div id="drop-zone" ondragover="onDrag(event)" ondragleave="offDrag()" ondrop="onDrop(event)">
      <div class="drop-icon">📂</div>
      <h2>Claude 离线对话查看器</h2>
      <p>将 conversations.json 拖拽到此处，或点击下方按钮选择文件。完全离线运行，文件不会上传。</p>
      <button id="file-btn" onclick="document.getElementById('file-input').click()">选择 JSON 文件</button>
      <input type="file" id="file-input" accept=".json" onchange="loadFile(this.files[0])">
    </div>

    <div id="chat-view">
      <div id="chat-header">
        <div id="chat-title"></div>
        <div id="chat-meta"></div>
      </div>
      <div id="chat-body"></div>
      <button id="export-btn" onclick="exportCurrent()">导出此对话为 .txt</button>
    </div>
  </div>
</div>

<script>
let allConvs = [];
let currentConv = null;
let filteredConvs = [];

function onDrag(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('drag-over'); }
function offDrag() { document.getElementById('drop-zone').classList.remove('drag-over'); }
function onDrop(e) { e.preventDefault(); offDrag(); loadFile(e.dataTransfer.files[0]); }

function loadFile(file) {
  if (!file) return;
  document.getElementById('file-name').textContent = file.name;
  const r = new FileReader();
  r.onload = e => parseData(e.target.result);
  r.readAsText(file);
}

function parseData(text) {
  let data;
  try { data = JSON.parse(text); } catch { alert('文件解析失败，请确认是有效的 JSON 文件'); return; }

  let convs = [];
  if (Array.isArray(data)) convs = data;
  else if (data.conversations) convs = data.conversations;
  else convs = [data];

  allConvs = convs.map(normalizeConv);
  filteredConvs = [...allConvs];

  const totalMsgs = allConvs.reduce((a, c) => a + c.messages.length, 0);
  document.getElementById('s-convs').textContent = allConvs.length;
  document.getElementById('s-msgs').textContent = totalMsgs;
  document.getElementById('stats-bar').style.display = 'flex';
  document.getElementById('search-wrap').style.display = 'block';

  renderList();
}

function normalizeConv(c) {
  const title = c.name || c.title || c.subject || '（无标题）';
  const date = c.created_at || c.updated_at || c.date || '';
  const rawMsgs = c.chat_messages || c.messages || [];
  const messages = rawMsgs.map(m => {
    const role = m.role || m.sender || 'unknown';
    let text = '';
    if (typeof m.content === 'string') text = m.content;
    else if (Array.isArray(m.content)) text = m.content.map(b => b.text || (typeof b === 'string' ? b : '')).filter(Boolean).join('\n');
    else if (m.text) text = m.text;
    return { role, text: text || '' };
  }).filter(m => m.text.trim());
  return { title, date, messages };
}

function renderList() {
  const el = document.getElementById('conv-list');
  if (!filteredConvs.length) { el.innerHTML = '<div class="empty">没有找到匹配的对话</div>'; return; }
  el.innerHTML = filteredConvs.map((c, i) => {
    const date = c.date ? new Date(c.date).toLocaleDateString('zh-CN') : '';
    return `<div class="conv-item" onclick="showConv(${allConvs.indexOf(c)})" id="ci-${allConvs.indexOf(c)}">
      <div class="conv-item-title">${esc(c.title)}</div>
      <div class="conv-item-meta">${date}${date && c.messages.length ? ' · ' : ''}${c.messages.length ? c.messages.length + ' 条消息' : ''}</div>
    </div>`;
  }).join('');
}

function filterList() {
  const q = document.getElementById('search').value.toLowerCase();
  filteredConvs = q ? allConvs.filter(c => c.title.toLowerCase().includes(q)) : [...allConvs];
  renderList();
  if (currentConv !== null) {
    const item = document.getElementById('ci-' + currentConv);
    if (item) item.classList.add('active');
  }
}

function showConv(i) {
  currentConv = i;
  document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
  const item = document.getElementById('ci-' + i);
  if (item) item.classList.add('active');

  const conv = allConvs[i];
  document.getElementById('drop-zone').style.display = 'none';
  const cv = document.getElementById('chat-view');
  cv.style.display = 'flex';

  document.getElementById('chat-title').textContent = conv.title;
  const date = conv.date ? new Date(conv.date).toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric' }) : '';
  document.getElementById('chat-meta').textContent = (date ? date + ' · ' : '') + conv.messages.length + ' 条消息';

  const body = document.getElementById('chat-body');
  body.innerHTML = conv.messages.map(m => {
    const roleLabel = m.role === 'human' || m.role === 'user' ? '你' : m.role === 'assistant' ? 'Claude' : m.role;
    const cls = m.role === 'human' || m.role === 'user' ? 'human' : m.role === 'assistant' ? 'assistant' : 'system';
    return `<div class="msg-wrap">
      <div class="msg-role ${cls}">${roleLabel}</div>
      <div class="msg-bubble ${cls}">${renderMd(m.text)}</div>
    </div>`;
  }).join('');
  body.scrollTop = 0;
}

function renderMd(text) {
  if (!text) return '';
  let t = esc(text);
  // code blocks
  t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
  // inline code
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  // headings
  t = t.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  t = t.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  t = t.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // bold/italic
  t = t.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // blockquote
  t = t.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // hr
  t = t.replace(/^---$/gm, '<hr>');
  // lists
  t = t.replace(/^\d+\. (.+)$/gm, '<li>$1</li>').replace(/(<li>.*<\/li>(\n|$))+/g, s => `<ol>${s}</ol>`);
  t = t.replace(/^[-*] (.+)$/gm, '<li>$1</li>').replace(/(<li>.*<\/li>(\n|$))+/g, s => {
    if (s.includes('<ol>')) return s;
    return `<ul>${s}</ul>`;
  });
  // paragraphs
  t = t.split(/\n\n+/).map(p => {
    p = p.trim();
    if (!p) return '';
    if (/^<(h[1-3]|ul|ol|pre|blockquote|hr)/.test(p)) return p;
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return t;
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function exportCurrent() {
  if (currentConv === null) return;
  const conv = allConvs[currentConv];
  const lines = [`对话标题：${conv.title}\n${'='.repeat(50)}\n`];
  conv.messages.forEach(m => {
    const label = m.role === 'human' || m.role === 'user' ? '你' : 'Claude';
    lines.push(`[${label}]\n${m.text}\n`);
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = conv.title.slice(0, 40).replace(/[\\/:*?"<>|]/g, '_') + '.txt';
  a.click();
}
</script>
</body>
</html>
